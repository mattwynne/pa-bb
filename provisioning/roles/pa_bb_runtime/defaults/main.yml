---
# Identity, storage, access and any private settings come from inventory.
pa_bb_prefix: '{{ pa_bb_home }}/.local'
pa_bb_source_dir: '{{ pa_bb_home }}/src/pa-bb'
pa_bb_source_repo: https://github.com/mattwynne/pa-bb.git
pa_bb_service_name: bb
pa_bb_require_home_mount: false
pa_bb_allow_service_start: false
pa_bb_node: /usr/bin/node
pa_bb_cli_argv: ['{{ pa_bb_node }}', '{{ pa_bb_prefix }}/lib/node_modules/bb-app/host-daemon/dist/bb']
pa_bb_user_path: '{{ pa_bb_prefix }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
# Bootstrap only: subsequent updates belong to the native runtime controls.
pa_bb_pi_seed: '1.5.0'
pa_bb_bb_seed: '0.49.0'
pa_bb_codex_seed: '0.163.0'
pa_bb_claude_seed: '2.1.319'
pa_bb_hermes_seed: '0.23.3'
# Review the tagged installer and its digest together when changing the seed.
pa_bb_hermes_installer_sha256: c73dad4dcf7c9ecadb98578e28cc763d23d7be3fa1b513545319038795493214
pa_bb_version_url: http://127.0.0.1:38886/api/v1/system/version
