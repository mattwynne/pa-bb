name: Docker CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test Docker pins and startup logic
        run: python3 -m unittest discover -s docker -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            pa-bb-ci:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test disposable BB installation
        run: python3 docker/smoke_test.py pa-bb-ci:${{ github.sha }}

      - name: Scan image vulnerabilities
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          scan-type: image
          image-ref: pa-bb-ci:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy.json
          timeout: 15m
          # Preserve the full report; enforce the fixable HIGH/CRITICAL gate below.
          exit-code: '0'
          ignore-unfixed: 'false'

      - name: Summarize vulnerability findings
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path('trivy.json').read_text())
          counts = Counter(v['Severity'] for result in report.get('Results', [])
                           for v in result.get('Vulnerabilities', []) or [])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Image vulnerability scan\n\n')
              summary.write('Fixable HIGH/CRITICAL findings and scanner/database errors '
                            'block publication. Other findings remain report-only. '
                            'Download the image-vulnerabilities artifact for details.\n\n')
              summary.write('| Severity | Package findings |\n| --- | ---: |\n')
              for severity in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN']:
                  summary.write(f'| {severity} | {counts[severity]} |\n')
          PY

      - name: Upload vulnerability report
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-vulnerabilities
          path: trivy.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reject fixable high and critical vulnerabilities
        run: python3 docker/check_vulnerabilities.py trivy.json

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done < <(jq -r '.tags[]' <<< "$IMAGE_METADATA")
